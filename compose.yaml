name: vendorlens

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vendorlens
      POSTGRES_USER: vendorlens
      POSTGRES_PASSWORD: vendorlens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendorlens -d vendorlens"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://vendorlens:vendorlens@database:5432/vendorlens
      UPLOAD_DIR: /app/uploads
      CHROMA_PATH: /app/data/chroma
      FRONTEND_ORIGIN: "http://localhost:${FRONTEND_PORT:-5173}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health')); raise SystemExit(data['status'] != 'healthy')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/data/chroma
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
